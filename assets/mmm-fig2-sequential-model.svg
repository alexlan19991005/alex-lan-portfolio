<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="Sequential model - customer first, DMA second">
<title>Sequential model - customer first, DMA second</title>
  <defs>
    <filter id="sk-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <pattern id="sk-h-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#dbeafe"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#bcd6f7" stroke-width="1.4"/>
    </pattern>
    <pattern id="sk-h-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#d8f3e3"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#b5e6c8" stroke-width="1.4"/>
    </pattern>
    <pattern id="sk-h-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#fdeecb"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#f3d68a" stroke-width="1.4"/>
    </pattern>
    <pattern id="sk-h-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#e7defc"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#c9b8f5" stroke-width="1.4"/>
    </pattern>
    <marker id="sk-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="800" fill="#ffffff"/>
  <g font-family="'Comic Sans MS','Chalkboard SE','Segoe Print','Bradley Hand',cursive">
    <text x="30" y="44" text-anchor="start" font-size="26" fill="#111827" font-weight="600">Sequential model - customer first, DMA second</text>

    <text x="700" y="84" text-anchor="middle" font-size="20" fill="#1d4ed8" font-weight="600">Stage 1 - HCP-week linear model</text>
    <rect x="30" y="104" width="640" height="60" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="350.0" y="124" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">customer-level campaign (with adstock)</text>
    <text x="350.0" y="146" text-anchor="middle" font-size="13" fill="#4b5563">decayed exposure, week by week</text>
    <rect x="730" y="104" width="640" height="60" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="1050.0" y="124" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">HCP attributes</text>
    <text x="1050.0" y="146" text-anchor="middle" font-size="13" fill="#4b5563">baseline traits of the HCP</text>
    <line x1="350" y1="164" x2="350" y2="180" stroke="#111827" stroke-width="2"/>
    <line x1="1050" y1="164" x2="1050" y2="180" stroke="#111827" stroke-width="2"/>
    <line x1="350" y1="180" x2="1050" y2="180" stroke="#111827" stroke-width="2"/>
    <line x1="700" y1="180" x2="700" y2="192" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="380" y="192" width="640" height="60" rx="14" fill="url(#sk-h-blue)" stroke="#1d4ed8" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="700.0" y="212" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">predicts HCP-week NBRx</text>
    <text x="700.0" y="234" text-anchor="middle" font-size="13" fill="#4b5563">the linear model at customer grain</text>
    <line x1="700" y1="252" x2="700" y2="268" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="380" y="268" width="640" height="60" rx="14" fill="url(#sk-h-green)" stroke="#15803d" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="700.0" y="288" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">residual = what stage 1 could not explain</text>
    <text x="700.0" y="310" text-anchor="middle" font-size="13" fill="#4b5563">the leftover becomes stage 2's target</text>
    <line x1="700" y1="328" x2="700" y2="344" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <text x="700" y="368" text-anchor="middle" font-size="20" fill="#1d4ed8" font-weight="600">Stage 2 - fit the loss</text>
    <rect x="30" y="388" width="640" height="60" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="350.0" y="408" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">DMA-level campaign (with adstock)</text>
    <text x="350.0" y="430" text-anchor="middle" font-size="13" fill="#4b5563">decayed exposure, market by market</text>
    <rect x="730" y="388" width="640" height="60" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="1050.0" y="408" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">DMA attributes</text>
    <text x="1050.0" y="430" text-anchor="middle" font-size="13" fill="#4b5563">size - region - baseline of the DMA</text>
    <line x1="350" y1="448" x2="350" y2="464" stroke="#111827" stroke-width="2"/>
    <line x1="1050" y1="448" x2="1050" y2="464" stroke="#111827" stroke-width="2"/>
    <line x1="350" y1="464" x2="1050" y2="464" stroke="#111827" stroke-width="2"/>
    <line x1="700" y1="464" x2="700" y2="476" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="380" y="476" width="640" height="60" rx="14" fill="url(#sk-h-blue)" stroke="#1d4ed8" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="700.0" y="496" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">fits stage 1's residuals</text>
    <text x="700.0" y="518" text-anchor="middle" font-size="13" fill="#4b5563">DMA signal explains what is left</text>
    <line x1="700" y1="536" x2="700" y2="552" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="30" y="552" width="1340" height="60" rx="14" fill="url(#sk-h-green)" stroke="#15803d" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="700.0" y="572" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">stepwise: keep only the DMA terms that explain the leftover</text>
    <text x="700.0" y="594" text-anchor="middle" font-size="13" fill="#4b5563">drop the rest</text>
    <rect x="30" y="632" width="1340" height="80" rx="14" fill="url(#sk-h-purple)" stroke="#6d28d9" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="700.0" y="662" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">While both stages run: search the adstock of BOTH campaigns</text>
    <text x="700.0" y="684" text-anchor="middle" font-size="14" fill="#111827">try decay / half-life values - refit, pick the best</text>
    <rect x="30" y="732" width="1340" height="56" rx="14" fill="url(#sk-h-orange)" stroke="#c2410c" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="700.0" y="750" text-anchor="middle" font-size="14" fill="#111827" font-weight="600">Why sequential: DMA campaigns are shared across HCPs in a market, so they belong in stage 2 -</text>
    <text x="700.0" y="772" text-anchor="middle" font-size="14" fill="#111827" font-weight="600">after the HCP-level signal is accounted for.</text>
  </g>
</svg>
