<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-label="Field engagement: S-learner versus R-learner">
<title>Field engagement · S-learner vs R-learner</title>
  <defs>
    <filter id="sk-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <pattern id="sk-h-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#dbeafe"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#bcd6f7" stroke-width="1.4"/>
    </pattern>
    <pattern id="sk-h-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#d8f3e3"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#b5e6c8" stroke-width="1.4"/>
    </pattern>
    <pattern id="sk-h-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#fdeecb"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#f3d68a" stroke-width="1.4"/>
    </pattern>
    <pattern id="sk-h-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#e7defc"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#c9b8f5" stroke-width="1.4"/>
    </pattern>
    <marker id="sk-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="700" fill="#ffffff"/>
  <g font-family="'Comic Sans MS','Chalkboard SE','Segoe Print','Bradley Hand',cursive">
    <text x="30" y="44" text-anchor="start" font-size="26" fill="#111827" font-weight="600">Field engagement · S-learner vs R-learner</text>
    <text x="350" y="86" text-anchor="middle" font-size="20" fill="#1d4ed8" font-weight="600">S-learner · one model</text>
    <text x="1050" y="86" text-anchor="middle" font-size="20" fill="#1d4ed8" font-weight="600">R-learner · two stages</text>
    <line x1="700" y1="66" x2="700" y2="640" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="30" y="108" width="310" height="64" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="185" y="135" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">HCP features x</text>
    <text x="185" y="155" text-anchor="middle" font-size="13" fill="#4b5563">claims · Rx · demographics</text>
    <rect x="350" y="108" width="310" height="64" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="505" y="135" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">field touch t</text>
    <text x="505" y="155" text-anchor="middle" font-size="13" fill="#4b5563">visit or not</text>
    <line x1="185" y1="172" x2="185" y2="186" stroke="#111827" stroke-width="2"/>
    <line x1="505" y1="172" x2="505" y2="186" stroke="#111827" stroke-width="2"/>
    <line x1="185" y1="186" x2="505" y2="186" stroke="#111827" stroke-width="2"/>
    <line x1="345" y1="186" x2="345" y2="196" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="30" y="196" width="640" height="64" rx="14" fill="url(#sk-h-blue)" stroke="#1d4ed8" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="350" y="223" text-anchor="middle" font-size="18" fill="#111827" font-weight="600">Single model μ(x, t)</text>
    <text x="350" y="245" text-anchor="middle" font-size="13" fill="#4b5563">learns outcome as f(x, t)</text>
    <circle cx="664" cy="202" r="11" fill="#111827"/>
    <text x="664" y="207" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">t</text>
    <line x1="340" y1="260" x2="340" y2="276" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="30" y="276" width="640" height="64" rx="14" fill="url(#sk-h-blue)" stroke="#1d4ed8" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="350" y="303" text-anchor="middle" font-size="18" fill="#111827" font-weight="600">τ̂ = μ(x,1) - μ(x,0)</text>
    <text x="350" y="325" text-anchor="middle" font-size="13" fill="#4b5563">run twice, take the difference</text>
    <line x1="340" y1="340" x2="340" y2="356" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="30" y="356" width="640" height="165" rx="14" fill="url(#sk-h-orange)" stroke="#c2410c" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="350" y="386" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">Limitations</text>
    <text x="350" y="410" text-anchor="middle" font-size="14" fill="#111827">t is one input among many —</text>
    <text x="350" y="432" text-anchor="middle" font-size="14" fill="#111827">regularization shrinks its effect toward zero</text>
    <text x="350" y="454" text-anchor="middle" font-size="14" fill="#111827">the model can explain outcomes with x alone</text>
    <text x="350" y="476" text-anchor="middle" font-size="14" fill="#111827">selective targeting: treated and control barely overlap,</text>
    <text x="350" y="498" text-anchor="middle" font-size="14" fill="#111827">counterfactual is extrapolated</text>
    <line x1="340" y1="521" x2="340" y2="537" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="30" y="537" width="640" height="84" rx="14" fill="url(#sk-h-purple)" stroke="#6d28d9" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="350" y="565" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">Question it answers poorly</text>
    <text x="350" y="589" text-anchor="middle" font-size="13" fill="#4b5563">whose outcome changes if we visit?</text>
    <rect x="730" y="108" width="310" height="64" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="885" y="135" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">m(x) = E[Y | x]</text>
    <text x="885" y="155" text-anchor="middle" font-size="13" fill="#4b5563">outcome model, ignores t</text>
    <rect x="1050" y="108" width="310" height="64" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="1205" y="135" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">e(x) = P(t=1 | x)</text>
    <text x="1205" y="155" text-anchor="middle" font-size="13" fill="#4b5563">propensity: who gets visited</text>
    <line x1="885" y1="172" x2="885" y2="186" stroke="#111827" stroke-width="2"/>
    <line x1="1205" y1="172" x2="1205" y2="186" stroke="#111827" stroke-width="2"/>
    <line x1="885" y1="186" x2="1205" y2="186" stroke="#111827" stroke-width="2"/>
    <line x1="1045" y1="186" x2="1045" y2="196" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="730" y="196" width="640" height="64" rx="14" fill="url(#sk-h-blue)" stroke="#1d4ed8" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="1050" y="223" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">R-loss: (Y - m(x)) ~ (t - e(x)) · τ̂(x)</text>
    <text x="1050" y="245" text-anchor="middle" font-size="13" fill="#4b5563">residual outcome on residual treatment</text>
    <circle cx="1364" cy="202" r="11" fill="#111827"/>
    <text x="1364" y="207" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">t</text>
    <line x1="1050" y1="260" x2="1050" y2="276" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="730" y="276" width="640" height="64" rx="14" fill="url(#sk-h-green)" stroke="#15803d" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="1050" y="303" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">τ̂(x) — the effect, modeled directly</text>
    <text x="1050" y="325" text-anchor="middle" font-size="13" fill="#4b5563">loss is minimized at the true effect</text>
    <line x1="1050" y1="340" x2="1050" y2="356" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="730" y="356" width="640" height="110" rx="14" fill="url(#sk-h-orange)" stroke="#c2410c" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="1050" y="386" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">Limitations</text>
    <text x="1050" y="410" text-anchor="middle" font-size="14" fill="#111827">needs good m(x) and e(x)</text>
    <text x="1050" y="434" text-anchor="middle" font-size="14" fill="#111827">use cross-fitting so stage 1 doesn't leak into stage 2</text>
    <line x1="1050" y1="466" x2="1050" y2="482" stroke="#111827" stroke-width="2" marker-end="url(#sk-arr)"/>
    <rect x="730" y="482" width="640" height="84" rx="14" fill="url(#sk-h-purple)" stroke="#6d28d9" stroke-width="2.5" filter="url(#sk-rough)"/>
    <text x="1050" y="510" text-anchor="middle" font-size="17" fill="#111827" font-weight="600">Question it answers</text>
    <text x="1050" y="534" text-anchor="middle" font-size="13" fill="#4b5563">how much does a visit change this HCP's NBRx?</text>
    <rect x="258.5625" y="652" width="18" height="16" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="284.5625" y="665" text-anchor="start" font-size="13.5" fill="#4b5563">inputs</text>
    <rect x="363.1125" y="652" width="18" height="16" rx="4" fill="url(#sk-h-blue)" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="389.1125" y="665" text-anchor="start" font-size="13.5" fill="#4b5563">model / prediction</text>
    <rect x="556.7625" y="652" width="18" height="16" rx="4" fill="url(#sk-h-green)" stroke="#15803d" stroke-width="1.6"/>
    <text x="582.7625" y="665" text-anchor="start" font-size="13.5" fill="#4b5563">incremental effect</text>
    <rect x="750.4125" y="652" width="18" height="16" rx="4" fill="url(#sk-h-purple)" stroke="#6d28d9" stroke-width="1.6"/>
    <text x="776.4125" y="665" text-anchor="start" font-size="13.5" fill="#4b5563">NBA rule</text>
    <rect x="869.8125" y="652" width="18" height="16" rx="4" fill="url(#sk-h-orange)" stroke="#c2410c" stroke-width="1.6"/>
    <text x="895.8125" y="665" text-anchor="start" font-size="13.5" fill="#4b5563">limitation</text>
    <circle cx="1013.0625" cy="660" r="9" fill="#111827"/>
    <text x="1013.0625" y="664" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">t</text>
    <text x="1030.0625" y="665" text-anchor="start" font-size="13.5" fill="#4b5563">receives action</text>
  </g>
</svg>
